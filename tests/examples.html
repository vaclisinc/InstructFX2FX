<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipeline Examples</title>
  <style>
    :root {
      --bg: #f5f1e8;
      --panel: #fffdf8;
      --ink: #1f1d1a;
      --muted: #6a6258;
      --line: #d8cfbf;
      --accent: #1f6f5f;
      --accent-soft: #dcefe8;
      --shadow: 0 18px 45px rgba(53, 42, 24, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(31, 111, 95, 0.12), transparent 32%),
        linear-gradient(180deg, #f8f4eb 0%, var(--bg) 100%);
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 3.6rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    .lede {
      margin: 0 0 24px;
      color: var(--muted);
      max-width: 760px;
      font-size: 1.02rem;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1.2fr 180px auto;
      gap: 12px;
      margin-bottom: 24px;
      align-items: center;
    }

    input,
    select,
    textarea,
    button {
      font: inherit;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 253, 248, 0.92);
      color: var(--ink);
      padding: 12px 14px;
    }

    textarea {
      min-height: 84px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.94;
    }

    .count {
      justify-self: end;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      gap: 18px;
    }

    .card {
      background: var(--panel);
      border: 1px solid rgba(216, 207, 191, 0.9);
      border-radius: 22px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .eyebrow {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.86rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.85rem;
    }

    .prompt {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.15;
    }

    .audio-row,
    .reprompt-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.5);
    }

    .panel h3 {
      margin: 0 0 10px;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    audio {
      width: 100%;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: "SFMono-Regular", "Menlo", "Consolas", monospace;
      font-size: 0.84rem;
      line-height: 1.45;
    }

    .empty {
      padding: 28px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.45);
    }

    @media (max-width: 840px) {
      .toolbar,
      .audio-row,
      .reprompt-row {
        grid-template-columns: 1fr;
      }

      .count {
        justify-self: start;
      }

      .card-top {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Pipeline Examples</h1>
    <p class="lede">
      Browse saved `tests/test_pipeline.py` examples, compare dry and processed audio,
      inspect parameters, and tweak a reprompt field you can copy back into the next run.
    </p>

    <section class="toolbar">
      <input id="search" type="search" placeholder="Filter by prompt, FX, or case" />
      <select id="case-filter">
        <option value="all">All cases</option>
      </select>
      <div class="count" id="count"></div>
    </section>

    <section class="grid" id="examples"></section>
  </main>

  <script src="./outputs/examples.js"></script>
  <script>
    const bundle = window.TEST_PIPELINE_EXAMPLES || { examples: [] };
    const examples = Array.isArray(bundle.examples) ? bundle.examples : [];

    const searchInput = document.getElementById("search");
    const caseFilter = document.getElementById("case-filter");
    const count = document.getElementById("count");
    const root = document.getElementById("examples");

    function uniqueCases(items) {
      return [...new Set(items.map((item) => item.case))].sort();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    async function copyText(text, button) {
      try {
        await navigator.clipboard.writeText(text);
        const previous = button.textContent;
        button.textContent = "Copied";
        setTimeout(() => {
          button.textContent = previous;
        }, 1200);
      } catch (_) {
        button.textContent = "Clipboard blocked";
      }
    }

    function render(items) {
      count.textContent = `${items.length} example${items.length === 1 ? "" : "s"}`;

      if (!items.length) {
        root.innerHTML = `
          <div class="empty">
            No examples matched. If the page is empty after a fresh run,
            rerun <code>.venv/bin/python tests/test_pipeline.py</code> to rebuild <code>tests/outputs/examples.js</code>.
          </div>
        `;
        return;
      }

      root.innerHTML = items.map((example, index) => {
        const fxPills = (example.fx_chain || []).map((fx) => `<span class="pill">${escapeHtml(fx)}</span>`).join("");
        const params = escapeHtml(JSON.stringify(example.params || {}, null, 2));
        const reprompt = escapeHtml(example.reprompt || example.prompt || "");

        return `
          <article class="card">
            <div class="card-top">
              <div>
                <div class="eyebrow">
                  <span>Case ${escapeHtml(example.case)}</span>
                  <span>Turn ${escapeHtml(example.turn)}</span>
                </div>
                <p class="prompt">${escapeHtml(example.prompt || "")}</p>
              </div>
              <div class="pill-row">${fxPills}</div>
            </div>

            <div class="audio-row">
              <section class="panel">
                <h3>Before</h3>
                <audio controls preload="none" src="./${escapeHtml(example.before_audio_path)}"></audio>
              </section>
              <section class="panel">
                <h3>After</h3>
                <audio controls preload="none" src="./${escapeHtml(example.after_audio_path)}"></audio>
              </section>
            </div>

            <div class="reprompt-row">
              <section class="panel">
                <h3>Reprompt</h3>
                <textarea id="reprompt-${index}">${reprompt}</textarea>
                <div class="actions">
                  <button type="button" data-copy-reprompt="${index}">Copy reprompt</button>
                  <button type="button" class="secondary" data-reset-reprompt="${index}" data-original-prompt="${escapeHtml(example.prompt || "")}">Reset</button>
                </div>
              </section>
              <section class="panel">
                <h3>Params</h3>
                <pre>${params}</pre>
                <div class="actions">
                  <button type="button" class="secondary" data-copy-params='${escapeHtml(JSON.stringify(example.params || {}))}'>Copy params JSON</button>
                </div>
              </section>
            </div>
          </article>
        `;
      }).join("");

      root.querySelectorAll("[data-copy-reprompt]").forEach((button) => {
        button.addEventListener("click", () => {
          const index = button.getAttribute("data-copy-reprompt");
          const textarea = document.getElementById(`reprompt-${index}`);
          copyText(textarea.value, button);
        });
      });

      root.querySelectorAll("[data-reset-reprompt]").forEach((button) => {
        button.addEventListener("click", () => {
          const index = Number(button.getAttribute("data-reset-reprompt"));
          const textarea = document.getElementById(`reprompt-${index}`);
          textarea.value = button.getAttribute("data-original-prompt") || "";
        });
      });

      root.querySelectorAll("[data-copy-params]").forEach((button) => {
        button.addEventListener("click", () => {
          copyText(button.getAttribute("data-copy-params"), button);
        });
      });
    }

    function applyFilters() {
      const query = searchInput.value.trim().toLowerCase();
      const selectedCase = caseFilter.value;
      const filtered = examples.filter((example) => {
        const matchesCase = selectedCase === "all" || example.case === selectedCase;
        if (!matchesCase) {
          return false;
        }

        if (!query) {
          return true;
        }

        const haystack = [
          example.case,
          String(example.turn),
          example.prompt,
          ...(example.fx_chain || []),
        ].join(" ").toLowerCase();
        return haystack.includes(query);
      });

      render(filtered);
    }

    uniqueCases(examples).forEach((caseName) => {
      const option = document.createElement("option");
      option.value = caseName;
      option.textContent = `Case ${caseName}`;
      caseFilter.appendChild(option);
    });

    searchInput.addEventListener("input", applyFilters);
    caseFilter.addEventListener("change", applyFilters);
    applyFilters();
  </script>
</body>
</html>
