[pytest]
# Pytest configuration for baseline-system

# Minimum required pytest version
minversion = 7.0

# Test paths
testpaths = tests

# Python files/classes/functions patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Custom markers
markers =
    integration: marks tests as integration tests requiring external APIs (deselect with '-m "not integration"')
    unit: marks tests as unit tests (no external dependencies)
    slow: marks tests as slow running
    requires_api_key: marks tests that require API keys

# Console output options
console_output_style = progress
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestDeprecationWarning
    ignore::pydantic.warnings.PydanticDeprecatedSince20

# Coverage options (if pytest-cov is used)
[coverage:run]
source = models,baseline_system
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
