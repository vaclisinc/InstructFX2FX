[pytest]
# Pytest configuration for baseline-system

# Minimum required pytest version
minversion = 7.0

# Test paths
testpaths = tests

# Python files/classes/functions patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    unit: marks tests as unit tests (no external dependencies)
    integration: marks tests as integration tests requiring external APIs (deselect with '-m "not integration"')
    slow: marks tests as slow running
    performance: marks tests as performance/benchmarking tests
    requires_api_key: marks tests that require API keys

# Console output options
console_output_style = progress
addopts =
    -v
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short
    --cov=src
    --cov=models
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestDeprecationWarning
    ignore::pydantic.warnings.PydanticDeprecatedSince20

# Logging configuration
log_cli = false
log_cli_level = INFO

# Coverage options (if pytest-cov is used)
[coverage:run]
source = src,models,baseline_system
omit =
    */tests/*
    */test_*
    */venv/*
    */__pycache__/*
    */.*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
fail_under = 80

[coverage:html]
directory = tests/coverage_html
