llm:
  provider: openrouter  # Options: openrouter, openai, claude

  # OpenRouter models (recommended - unified access to all providers):
  model: anthropic/claude-sonnet-4-5  # Best for coding/reasoning (2025/9/29)
  # model: openai/gpt-5                # OpenAI flagship (2025/8)
  # model: anthropic/claude-opus-4-1   # Best reasoning model
  # model: google/gemini-2.5-pro       # Google's latest

  # OpenAI direct API models (provider: openai):
  # model: gpt-5                       # Latest flagship
  # model: gpt-5-mini                  # Faster, cheaper
  # model: gpt-4.1                     # Improved GPT-4, 1M context

  # Anthropic direct API models (provider: claude):
  # model: claude-sonnet-4-5-20250929  # Best coding (Sep 2025)
  # model: claude-haiku-4-5-20251015   # Fastest, cheapest (Oct 2025)
  # model: claude-opus-4-1-20250805    # Best reasoning (Aug 2025)

prompts:
  generation_template: prompts/generation.txt  # Parameter generation prompt
  judge_template: prompts/judge.txt            # Audio quality judge prompt
  refinement_template: prompts/refinement.txt  # Parameter refinement prompt

# Refinement loop settings
refinement:
  max_iterations: 10          # Maximum number of refinement iterations
  target_score: 8.0           # Stop if score >= this value (good enough)
  convergence_threshold: 0.1  # Stop if score improvement < this value (no progress)
