# Scoring System Configuration
#
# Configuration for LLM-based scoring of audio effect parameters
# This file defines scoring modes, dimension weights, and retry behavior

scoring:
  # Scoring mode
  # - parameter_only: Fast mode, evaluates parameters without audio processing
  # - audio_based: Comprehensive mode, includes audio analysis
  mode: parameter_only

  # Scoring dimensions to evaluate
  dimensions:
    - semantic_match      # How well parameters align with description intent
    - technical_quality   # Musical/audio engineering appropriateness
    - specificity         # Precision and purposefulness of parameters

  # Dimension weights (must sum to 1.0)
  # These determine the relative importance of each dimension in the overall score
  weights:
    semantic_match: 0.5       # 50% weight on semantic alignment
    technical_quality: 0.3    # 30% weight on technical quality
    specificity: 0.2          # 20% weight on parameter specificity

  # Temperature for LLM scoring (0.0-2.0)
  # Lower values = more deterministic/consistent scores
  # Higher values = more varied/creative evaluations
  temperature: 0.3

  # Retry configuration for handling malformed responses
  retry:
    # Maximum retry attempts before raising error
    max_attempts: 3

    # Whether to use correction prompts when retrying
    # If true, sends detailed error information to guide LLM toward valid output
    correction_prompt: true
