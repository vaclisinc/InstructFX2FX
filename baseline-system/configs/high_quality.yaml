# High Quality Research Configuration
# Use for final experiments and paper results

llm:
  provider: anthropic
  model: claude-3-opus-20240229  # Most capable model
  temperature: 0.5  # More deterministic
  max_tokens: 2000

audio:
  sample_rate: 96000  # Higher quality audio
  format: wav
  effects:
    - reverb
    - eq
  validation: true

scoring:
  method: llm_judge  # Most thorough evaluation
  threshold: 0.8  # Stricter quality bar

execution:
  batch_size: 5
  checkpoint_interval: 1  # Checkpoint every experiment
  max_retries: 5
  timeout: 600  # Allow more time

output:
  base_dir: ./outputs
  save_audio: true
  save_parameters: true
  save_metadata: true
  save_logs: true
  log_level: DEBUG  # Detailed logging
